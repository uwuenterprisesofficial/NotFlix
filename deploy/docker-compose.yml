# NotFlix on a server, from the images scripts/publish.sh pushes (no source code needed here).
#
# The server doesn't look for streams itself: it keeps accounts, lists, friends, Watch Together
# and the shared stream library. The desktop apps find and play streams on their PCs (hybrid
# mode) and share what they find with the library here.
#
#   cp .env.example .env      then fill it in
#   docker compose pull
#   docker compose up -d
#
# See the README (Deploying on a server). Unlike the development setup in the repository's root,
# nothing is mounted over the images' code.
name: notflix

x-backend: &backend
  image: ${REGISTRY:-registry.uwuenterprises.de}/notflix-backend:${TAG:-latest}
  restart: unless-stopped
  # Settings come from .env next to this file, or from the deploy tool's variables (Portainer,
  # Dokploy, ...): both fill in the ${...} below. A .env file is also passed as a whole, for any
  # other backend setting (see the repository's .env.example); the lines below win.
  env_file:
    - path: .env
      required: false
  environment:
    API_KEY: ${API_KEY:?Set API_KEY (at least 16 characters)}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
    # The server's public address (this backend, e.g. https://notflix.example.com): sign-ins
    # come back here, then go on to the desktop app.
    FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL (the server's public address, e.g. https://notflix.example.com)}
    MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
    MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
    MAL_REDIRECT_URI: ${MAL_REDIRECT_URI:-${FRONTEND_URL}/auth/callback}
    ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
    ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
    ANILIST_REDIRECT_URI: ${ANILIST_REDIRECT_URI:-${FRONTEND_URL}/auth/anilist/callback}
    ADMINS: ${ADMINS:-}
    DATABASE_URL: postgresql+psycopg://notflix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/notflix
    REDIS_URL: redis://redis:6379/0
    MEDIA_DIR: /media
    # No scraping on the server: every stream source is off (whatever .env says). Streams are
    # found by the desktop apps, which share them through the library.
    ANISCRAPER_URL: ""
    ANIWORLD_URL: ""
    ANIWORLD_API_URL: ""
    ANIVEXA_URL: ""
    REANIME_URL: ""

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: notflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: notflix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notflix"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # The API, which the desktop apps connect to (port 6500 on the server; put an HTTPS reverse
  # proxy in front, the API key travels in a header). On start it migrates the database.
  backend:
    <<: *backend
    # The image's start script: migrations, then the API. (An image older than this script
    # fails with "notflix-start: not found": publish it again.)
    command: notflix-start
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # Every request needs the key, /health too.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8000/health', headers={'x-api-key': os.environ['API_KEY']}), timeout=5)"
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 5
    ports:
      - "6500:8000"

  # Background jobs: intro/outro analysis, and completing the catalogue. They start once the
  # backend has migrated the database.
  worker:
    <<: *backend
    command: rq worker analysis --url redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy

  catalog-worker:
    <<: *backend
    command: rq worker catalog --url redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
