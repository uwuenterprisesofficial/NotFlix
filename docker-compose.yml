name: notflix

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://notflix:notflix@db:5432/notflix
    REDIS_URL: redis://redis:6379/0
    MEDIA_DIR: /media
  volumes:
    - ./backend:/app
    - ./media:/media:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: notflix
      POSTGRES_PASSWORD: notflix
      POSTGRES_DB: notflix
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notflix"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: rq worker analysis --url redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
