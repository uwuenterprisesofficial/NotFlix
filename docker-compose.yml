name: notflix

x-backend: &backend
  build: ./backend
  # Values come from ./.env, which Compose reads automatically for ${...} substitution.
  environment:
    MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
    MAL_CLIENT_SECRET: ${MAL_CLIENT_SECRET:-}
    MAL_REDIRECT_URI: ${MAL_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
    ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
    ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
    ANILIST_REDIRECT_URI: ${ANILIST_REDIRECT_URI:-http://localhost:3000/api/auth/anilist/callback}
    SECRET_KEY: ${SECRET_KEY:-change-me}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    # Stream providers; an empty URL disables one. Anivexa must be run separately.
    ANIVEXA_URL: ${ANIVEXA_URL:-}
    REANIME_URL: ${REANIME_URL:-}
    # AniWorld and animetoast via the bundled AniScraper service by default; set ANISCRAPER_URL=
    # (empty) in .env to use ANIWORLD_API_URL or direct scraping instead. Containers talk to each
    # other on the container port (8000), not the port published to the host (8001).
    ANISCRAPER_URL: ${ANISCRAPER_URL-http://aniscraper:8000}
    ANIWORLD_API_URL: ${ANIWORLD_API_URL:-}
    ANIWORLD_URL: ${ANIWORLD_URL-https://aniworld.to}
    # No default here: Compose before 2.24 cuts ${VAR:-default} at the first '}'.
    ANIWORLD_SERIES_PATH: ${ANIWORLD_SERIES_PATH:-}
    DATABASE_URL: postgresql+psycopg://notflix:notflix@db:5432/notflix
    REDIS_URL: redis://redis:6379/0
    MEDIA_DIR: /media
    # An intro/outro analysis running longer than this is stopped and marked failed.
    ANALYSIS_TIMEOUT_MINUTES: ${ANALYSIS_TIMEOUT_MINUTES:-10}
    CATALOG_REFRESH_DAYS: ${CATALOG_REFRESH_DAYS:-30}
    CATALOG_SYNOPSIS_LANGUAGES: ${CATALOG_SYNOPSIS_LANGUAGES-de}
    # Genre search (MAL's own API can't list shows by genre). Empty: only known shows.
    JIKAN_URL: ${JIKAN_URL-https://api.jikan.moe/v4}
  # Lets the containers reach services running on your machine (Anivexa, ReAnime) at
  # http://host.docker.internal:<port>; "localhost" inside a container is the container itself.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend:/app
    - ./media:/media:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    aniscraper:
      condition: service_started

services:
  # AniWorld + animetoast scraper (aniscraper/), the default source of German streams.
  aniscraper:
    build: ./aniscraper
    restart: unless-stopped
    ports:
      - "8001:8000"  # API docs at http://localhost:8001/docs

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: notflix
      POSTGRES_PASSWORD: notflix
      POSTGRES_DB: notflix
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notflix"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: rq worker analysis --url redis://redis:6379/0

  # Adds shows to the catalogue and completes them (MAL details, German synopses).
  catalog-worker:
    <<: *backend
    command: rq worker catalog --url redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
